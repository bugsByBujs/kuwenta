<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Kuwenta — Offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: #F7F4EC; color: #1E1E1E;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .mark {
        width: 72px; height: 72px; border-radius: 18px; background: #006241;
        display: grid; place-items: center; margin: 0 auto 20px;
        color: #fff; font-size: 40px; font-weight: 800; line-height: 1;
      }
      h1 { font-size: 22px; margin-bottom: 8px; }
      p { font-size: 15px; color: #5a5a5a; max-width: 26ch; margin: 0 auto 20px; line-height: 1.5; }
      button {
        border: 0; background: #00A862; color: #fff; font-size: 16px; font-weight: 600;
        padding: 13px 28px; border-radius: 999px; cursor: pointer;
      }
      button:active { transform: scale(0.96); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">K</div>
      <h1>You're offline</h1>
      <p>Kuwenta needs a connection to load your latest money data. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
